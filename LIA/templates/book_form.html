{% extends "base.html" %} 
{% block title %} 
Add a book 
{% endblock %} 
    {%block content %}
    <h1> Add a book to your reading list </h1>

    <form method="POST">
        <div class="input-container">
            <label for="title"> title </label>

            <input
                id="title"
                name="title"
                type="text"
                maxlength="100"
                value="{{ title or '' }}"
                required
            />
        </div>

        <div class="input-container">
            <label for="author"> Author </label>
            
            <input
                id="author"
                name="author"
                type="text"
                maxlength="100"
                value="{{ author or '' }}"
                required
            />
        </div>

        <div class="input-container">
            <label for="note"> note </label>
            
            <textarea 
            name="note" 
            id="note"
            maxlength="1000"
            placeholder="Maximum of 1000 characters"
            rows="5"
            >{% if note %}{{ note }}{% endif %}</textarea>
        </div>

        <div class="input-container">
            <label for="status"> Reading Status </label>

            <select name="status" id="status" required>
                <option value=""> Select Reading Status </option>
                {% for option in status_options %}
                <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>

        <button  class=btn type="submit">Add Book</button>
    </form>

{% endblock %}
