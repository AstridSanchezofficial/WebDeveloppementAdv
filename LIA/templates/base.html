<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Book shelf app
        {% endblock %}
    </title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">

</head>
    
<body>
    <header>
        <nav>
            <div class="nav-container">
                <div class="logo">
                    <i class="bi bi-book"></i>
                    <a href="{{url_for('home')}}">Book shelf app</a>
                </div>
        </nav>

    </header>

    <main>
        <section>
            <div class="container">
                {% block content %}
                {% endblock %}
            </div>
        </section>
    </main>



</body>
